name: happy_tails
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.3.1

  # Cupertino Icons font for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  # Includes Material Icons font.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/Cat/
    - assets/images/Cat/catFood/
    - assets/images/Cat/catFood/CanFood/
    - assets/images/Cat/catFood/DryFood/
    - assets/images/Cat/catFood/WetFood/
    - assets/images/Cat/kitten/
    - assets/images/Cat/kitten/dryFood/
    - assets/images/Cat/kitten/feeder/
    - assets/images/Cat/kitten/milk/
    - assets/images/Cat/kitten/wetFood/
    - assets/images/Cat/accessories/
    - assets/images/Cat/litter/
    - assets/images/Cat/toys/
    - assets/images/profile/profile_avatar.jpg